<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Snehand Photography</title>
<style>
  :root{--bg:#f6f3ee;--card:#fff;--ink:#1d1b19;--mut:#76706a;--line:#e4ded6;--acc:#1d1b19;--bad:#b3261e;--ok:#1e7a46}
  @media (prefers-color-scheme:dark){:root{--bg:#141312;--card:#1e1c1a;--ink:#f1ece5;--mut:#9b948b;--line:#33302c;--acc:#f1ece5;--bad:#f2b8b5;--ok:#7fd3a0}}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .box{max-width:1040px;margin:0 auto;padding:24px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  h1{font-family:"Playfair Display",Georgia,serif;margin:0 0 4px}
  input[type=text],input[type=password]{width:100%;padding:12px;margin:6px 0 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:15px}
  button{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;font-size:14px;background:var(--acc);color:var(--bg)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  #login{max-width:380px;margin:12vh auto}
  #panel{display:none}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
  .up{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .it{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);position:relative}
  .it img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line)}
  .it .nm{padding:8px 10px 4px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .act{display:flex;gap:6px;padding:4px 10px 10px}
  .it .act button{flex:1;padding:7px 8px;font-size:12px}
  .it .act .del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  .badge{position:absolute;top:8px;left:8px;background:var(--ok);color:#fff;font-size:11px;padding:3px 8px;border-radius:20px}
  #msg{font-size:13px;color:var(--mut);min-height:18px;margin:8px 0 14px}
  .err{color:var(--bad)!important}
  .note{font-size:12px;color:var(--mut);margin:0 0 12px}
</style>
</head>
<body>
<div class="box">

  <form id="login" class="card">
    <h1>Admin</h1>
    <p style="color:var(--mut);margin:0 0 18px;font-size:14px">Snehand Photography</p>
    <label>Username<input id="u" type="text" autocomplete="username" required></label>
    <label>Password<input id="p" type="password" autocomplete="current-password" required></label>
    <button type="submit" style="width:100%">Sign in</button>
    <div id="lmsg" class="err" style="margin-top:10px;font-size:13px"></div>
  </form>

  <div id="panel">
    <div class="bar">
      <div><h1>Images</h1><span style="color:var(--mut);font-size:13px">Folder: /public</span></div>
      <div style="display:flex;gap:8px">
        <button class="ghost" id="refresh">Refresh</button>
        <button class="ghost" id="out">Sign out</button>
      </div>
    </div>
    <div class="card">
      <p class="note">Click <b>Replace</b> on a picture to overwrite it with a new one. The file name stays the same, so your website updates automatically after the next deploy, about a minute.</p>
      <div id="msg"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var API = "/.netlify/functions/gallery";
  var $ = function (id) { return document.getElementById(id); };
  var cred = null;
  var fresh = {};   // name -> preview of a just-replaced image (site copy updates after deploy)
  var busy = false;

  function call(data) {
    data.u = cred.u; data.p = cred.p;
    return fetch(API, { method: "POST", body: JSON.stringify(data) })
      .then(function (r) { return r.json().then(function (j) { j._ok = r.ok; j._status = r.status; return j; }); });
  }
  function say(t, bad) { $("msg").textContent = t; $("msg").className = bad ? "err" : ""; }
  function lock(v) {
    busy = v;
    var bs = document.querySelectorAll("#panel button");
    for (var i = 0; i < bs.length; i++) bs[i].disabled = v;
  }
  function signOut() { sessionStorage.removeItem("sn_c"); location.reload(); }

  function show() {
    $("login").style.display = "none";
    $("panel").style.display = "block";
    load();
  }

  $("login").addEventListener("submit", function (e) {
    e.preventDefault();
    cred = { u: $("u").value.trim(), p: $("p").value };
    call({ action: "login" }).then(function (j) {
      if (j._ok) { sessionStorage.setItem("sn_c", JSON.stringify(cred)); show(); }
      else $("lmsg").textContent = j.error || "Login failed";
    }).catch(function () { $("lmsg").textContent = "Network error"; });
  });

  $("out").onclick = signOut;
  $("refresh").onclick = function () { load(); };

  // ---- Show every image in /public ----
  function load() {
    say("Loading…");
    return call({ action: "list" }).then(function (j) {
      if (j._status === 401) return signOut();
      if (!j._ok) return say(j.error, true);
      if (!j.files.length) {
        say("No .jpg files found in /public on GitHub (repo " + j.repo + ", branch " + j.branch + "). Files seen there: " +
            (j.seen && j.seen.length ? j.seen.join(", ") : "none, the folder is empty or missing") +
            ". Push your images to GitHub, then press Refresh.", true);
        $("grid").innerHTML = "";
        return;
      }
      say(j.files.length + " image(s) in /public");
      var g = $("grid"); g.innerHTML = "";
      j.files.forEach(function (f) { g.appendChild(card(f)); });
    }).catch(function () { say("Network error", true); });
  }

  function card(f) {
    var d = document.createElement("div"); d.className = "it";
    var src = fresh[f.name] || f.url;
    d.innerHTML =
      (fresh[f.name] ? '<span class="badge">Updated</span>' : "") +
      '<img loading="lazy" alt=""><div class="nm"></div>' +
      '<div class="act"><button class="rep">Replace</button><button class="del">Delete</button></div>';
    var im = d.querySelector("img");
    im.onerror = function () {
      if (im.dataset.tried) { im.alt = "Preview not available"; return; }
      im.dataset.tried = "1"; im.src = f.local;
    };
    im.src = src;
    d.querySelector(".nm").textContent = f.name;
    d.querySelector(".rep").onclick = function () { pickReplacement(f); };
    d.querySelector(".del").onclick = function () { remove(f); };
    return d;
  }

  // ---- Delete ----
  function remove(f) {
    if (!confirm("Delete " + f.name + "? If your website uses it, the picture will disappear.")) return;
    lock(true); say("Deleting…");
    call({ action: "delete", name: f.name, sha: f.sha }).then(function (r) {
      lock(false);
      if (r._ok) {
        delete fresh[f.name];
        load().then(function () { say("Deleted " + f.name + ". Live site updates in about a minute."); });
      } else {
        load().then(function () { say(r.error || "Delete failed", true); });
      }
    });
  }

  // ---- Image helpers ----
  function extOf(n) { return (n.split(".").pop() || "").toLowerCase(); }
  var MIME = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp" };

  function readBase64(file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(",")[1]); };
      r.onerror = rej; r.readAsDataURL(file);
    });
  }

  // Shrink to max 2000px and keep the requested format (so the file name/extension stays the same)
  function shrink(file, mime) {
    return new Promise(function (res, rej) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var m = mime === "image/png" ? 1600 : 2000;
        var s = Math.min(1, m / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        var ctx = c.getContext("2d");
        if (mime === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); }
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var out = c.toDataURL(mime, 0.85);
        res({ b64: out.split(",")[1], preview: out });
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("bad image")); };
      img.src = url;
    });
  }

  // ---- Replace: new picture overwrites the old file name ----
  function pickReplacement(f) {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/jpeg";
    inp.onchange = function () { if (inp.files[0]) replace(f, inp.files[0]); };
    inp.click();
  }

  async function replace(f, file) {
    if (busy) return;
    if (!confirm("Replace " + f.name + " with " + file.name + "?\nThe old picture will be overwritten.")) return;
    lock(true); say("Replacing " + f.name + "…");
    try {
      var ext = extOf(f.name), b64, preview;
      if (MIME[ext]) {
        var o = await shrink(file, MIME[ext]); b64 = o.b64; preview = o.preview;
      } else {                       // gif: upload as-is
        b64 = await readBase64(file); preview = "data:image/gif;base64," + b64;
        if (b64.length > 4500000) throw new Error("GIF too large");
      }
      var r = await call({ action: "upload", name: f.name, content: b64 });
      if (!r._ok) { lock(false); return say(r.error, true); }
      fresh[f.name] = preview;
      lock(false);
      say("Replaced " + f.name + ". Live site updates in about a minute.");
      load();
    } catch (e) {
      lock(false); say("Could not process that image: " + e.message, true);
    }
  }

  var saved = sessionStorage.getItem("sn_c");
  if (saved) { try { cred = JSON.parse(saved); show(); } catch (e) {} }
})();
</script>
</body>
</html>
